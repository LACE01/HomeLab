server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Default nginx cap is 1MB, which silently 413s any file upload bigger than
    # that (Albert CIS/MS-ISAC exports, SBOM files, IR case artifacts, etc. all
    # regularly exceed 1MB). Raised well above what this app's largest expected
    # upload looks like in practice.
    client_max_body_size 200m;

    # Reverse-proxy API calls to the backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
