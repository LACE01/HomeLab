services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host — only the backend talks to it.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # NET_RAW + NET_ADMIN let nmap run real SYN scans (-sS) and OS fingerprinting (-O)
    # instead of falling back to slow TCP-connect scans. Only grant this if you intend
    # to use the active Nmap scanning feature and only ever point it at ranges you're
    # authorized to scan -- see Admin > Nmap Scans for the target/authorization gate.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-vulnops}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
    # Not published to the host — only nginx (frontend) talks to it.

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HOST_PORT:-6969}:80"

volumes:
  mongo_data:
