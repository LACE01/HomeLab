services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host — only the backend talks to it.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # NET_RAW + NET_ADMIN let nmap run real SYN scans (-sS) and OS fingerprinting (-O)
    # instead of falling back to slow TCP-connect scans. Only grant this if you intend
    # to use the active Nmap scanning feature and only ever point it at ranges you're
    # authorized to scan -- see Admin > Nmap Scans for the target/authorization gate.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-vulnops}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-VulnOps <noreply@vulnops.local>}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      BACKUP_SCHEDULE_ENABLED: ${BACKUP_SCHEDULE_ENABLED:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # Backups must live on a volume, not the container's own filesystem -- the
      # container gets recreated on every deploy/update and would take the backup
      # with it. Set BACKUP_SCHEDULE_ENABLED=true to also run these nightly.
      - vulnops_backups:/app/backups
      # Same reasoning for IR case artifacts (arbitrary uploaded files -- logs,
      # spreadsheets, PDFs, etc. attached to an incident) -- these need to survive
      # container recreation too, unlike the rest of the container's filesystem.
      - vulnops_ir_artifacts:/app/ir_artifacts
    # Not published to the host — only nginx (frontend) talks to it.

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HOST_PORT:-6969}:80"

volumes:
  mongo_data:
  vulnops_backups:
  vulnops_ir_artifacts:
