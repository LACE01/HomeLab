name: CI

on:
  push:
    branches: [self-hosted, main]
  pull_request:
    branches: [self-hosted, main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Import sanity check
        working-directory: backend
        run: |
          MONGO_URL=mongodb://localhost:27017 DB_NAME=ci_import_check JWT_SECRET=ci-test-secret \
            python3 -c "import server; print('server module imports cleanly')"

      # Explicit file list, not a test_*.py glob -- this directory also holds tests
      # that depend on a real (not committed) Albert export upload, and older
      # live-environment E2E tests from before the self-hosted branch. See
      # backend/tests/README.md for why those are excluded here.
      - name: Run backend test suite
        working-directory: backend
        run: |
          set -e
          for f in \
            tests/test_albert_gaps2.py \
            tests/test_albert_ports.py \
            tests/test_asset_albert_link.py \
            tests/test_attack_telemetry.py \
            tests/test_attack_path_engine.py \
            tests/test_aws_cspm.py \
            tests/test_batch_ui_fixes.py \
            tests/test_backups_offsite_and_verify.py \
            tests/test_container_scan.py \
            tests/test_cf_diagnostics.py tests/test_opencti_client.py \
            tests/test_cti.py \
            tests/test_secrets_scan.py \
            tests/test_domain_email_security.py \
            tests/test_entra_sso.py \
            tests/test_external_checks.py \
            tests/test_eol_tracking.py \
            tests/test_feature_flags.py \
            tests/test_hash_intel_and_stealer_logs.py \
            tests/test_new_connectors.py \
            tests/test_pci_dss_compliance.py \
            tests/test_platform_fixes.py \
            tests/test_qualys_gav.py \
            tests/test_report_templates.py \
            tests/test_questionnaire_v3.py \
            tests/test_scheduled_reports.py \
            tests/test_security_news.py \
            tests/test_security_reviews.py \
            tests/test_security_reviews_p23.py \
            tests/test_security_reviews_fixes.py \
            tests/test_sr_completeness.py \
            tests/test_tenable_sync.py \
            tests/test_threat_modeling.py \
            tests/test_threat_intel_watchlist.py \
            tests/test_vendor_candidates.py \
            tests/test_vendor_finding_detection.py \
            tests/test_vendor_gaps.py \
            tests/test_vendor_management.py \
            tests/test_yara_vt_wiring.py \
          ; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          CI: "false" # don't fail the build on ESLint warnings, only real build errors
        run: npm run build
